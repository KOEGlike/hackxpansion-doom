[package]
name = "tinydoom"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Tiny Doom-like raycaster for the hackxpansion console (fits 512 KiB RAM)"

[dependencies]
lz4_flex = { version = "0.11", default-features = false }
# Pure-Rust math for no_std targets (sin/cos/sqrt have no core impls here).
libm = "0.2"

[target.'cfg(target_os = "none")'.dependencies]
defmt = "1.1"

[build-dependencies]
wadtool = { path = "../wadtool" }

[dev-dependencies]
