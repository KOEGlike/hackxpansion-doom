[workspace]
members = ["tiny", "wadtool", "doom-core", "doom-sys"]
default-members = [".", "tiny", "wadtool", "doom-core", "doom-sys"]
resolver = "2"

[profile.release]
lto = false
codegen-units = 1

[profile.test]
lto = false
codegen-units = 1

[package]
edition = "2024"
name = "doom-app"
version = "0.1.0"
license = "GPL-3.0"
description = "DOOM port app for the hackxpansion console"
repository = "https://github.com/KOEGlike/hackxpansion-doom"
# doom-app is the workspace root: keep sibling crates and the legacy
# Chocolate-Doom reference out of the published .crate file.
exclude = ["tiny/", "wadtool/", "doom-core/", "doom-sys/", "Cargo.lock"]

[dependencies]
xpanse-api = "0.2"
tinydoom = { version = "0.1.0", path = "./tiny" }
